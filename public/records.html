<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attendance Records | Attendance Recording System</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="layout">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-icon">🕒</div>
        <span>Attendance System</span>
      </div>
      <nav>
        <a href="index.html">📊 Dashboard</a>
        <a href="attendance.html">✅ Attendance</a>
        <a href="students.html">👥 Students / Employees</a>
        <a href="records.html" class="active">📋 Attendance Records</a>
        <a href="settings.html">⚙️ Settings</a>
      </nav>
    </aside>

    <!-- Main area -->
    <div class="main">
      <header class="topbar">
        <button class="menu-btn" id="menuBtn" aria-label="Open menu">☰</button>
        <h1>Attendance Records</h1>
        <div class="clock" id="clock"></div>
      </header>

      <main class="content">
        <div class="card">
          <div class="toolbar">
            <div class="grow">
              <label for="searchInput">Search by name or ID</label>
              <input type="search" id="searchInput" placeholder="Type a name or ID Number..." />
            </div>
            <div class="field">
              <label for="dateFilter">Filter by date</label>
              <input type="date" id="dateFilter" />
            </div>
            <button class="btn btn-light" id="todayBtn">Today</button>
            <button class="btn btn-light" id="clearBtn">Show All</button>
          </div>

          <p id="countText" style="color: var(--muted); margin-bottom: 12px;"></p>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>ID Number</th>
                  <th>Full Name</th>
                  <th>Date</th>
                  <th>Time In</th>
                  <th>Time Out</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="recordsBody">
                <tr><td colspan="6" class="empty-row">Loading...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script src="js/records.js"></script>
</body>
</html>
